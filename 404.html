		.nf-mark {

		.nf-ink { fill: var(--fg); }
		.nf-acc { fill: var(--acc); }

		.nf-anim {

			animation-fill-mode: both;
			animation-timing-function: linear;
		}
		.nf-x { animation-name: nf-x; }
		.nf-y { animation-name: nf-y; }
		.nf-sq {
			transform-box: fill-box;
			transform-origin: 50% 100%;
			animation-name: nf-sq;
		}

		/* teeters on the edge, rolls off, bounces twice, rests on the floor */
		@keyframes nf-x {
			0%, 10% { transform: translateX(0); }
			16% { transform: translateX(26px); }
			20% { transform: translateX(14px); }
			30% { transform: translateX(90px); }
			100% { transform: translateX(260px); }
		}
		@keyframes nf-y {
			0%, 20% { transform: translateY(0); animation-timing-function: cubic-bezier(.55, 0, 1, .45); }
			44% { transform: translateY(420px); animation-timing-function: cubic-bezier(0, .55, .45, 1); }
			60% { transform: translateY(266px); animation-timing-function: cubic-bezier(.55, 0, 1, .45); }
			74% { transform: translateY(420px); animation-timing-function: cubic-bezier(0, .55, .45, 1); }
			83% { transform: translateY(364px); animation-timing-function: cubic-bezier(.55, 0, 1, .45); }
			91%, 100% { transform: translateY(420px); }
		}
		@keyframes nf-sq {
			0%, 43.8% { transform: none; }
			44% { transform: scale(1.3, .7); }
			47%, 73.8% { transform: none; }
			74% { transform: scale(1.18, .82); }
			77%, 90.8% { transform: none; }
			91% { transform: scale(1.08, .92); }
			94%, 100% { transform: none; }
		}

		@media (prefers-reduced-motion: reduce) {
			.nf-anim { animation: none; }
			.nf-x { transform: translateX(260px); }
			.nf-y { transform: translateY(420px); }
		}

		.nf-code {

		.nf-text {

			color: var(--mut);
		}

		.nf .links {

		@media (max-width: 600px) {

			}

			}
